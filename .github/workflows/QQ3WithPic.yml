name: Build ZeroClaw armv7 (QQ + bubbles + image fix)

# 给 Armbian armv7（onecloud / S905）出带 QQ 渠道的二进制，
# 并打上两个补丁：①按空行拆成多条气泡 ②按魔数修正图片后缀（QQ 会把 JPEG 标成 .png，导致视觉链路丢图）
#
# 用法：放到任意仓库 .github/workflows/build-armv7-qq.yml
# Actions -> 该 workflow -> Run workflow（tag 默认 v0.8.7）

on:
  workflow_dispatch:
    inputs:
      version:
        description: "要构建的上游 tag"
        required: true
        default: "v0.8.7"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - name: Checkout upstream
        uses: actions/checkout@v4
        with:
          repository: zeroclaw-labs/zeroclaw
          ref: ${{ inputs.version }}

      - name: Apply QQ multi-bubble patch
        env:
          PATCH_B64: ""
        run: |
          echo "$PATCH_B64" | base64 -d > /tmp/qq-split.patch
          echo "--- patch preview ---"
          head -20 /tmp/qq-split.patch
          git apply --verbose /tmp/qq-split.patch

      - name: Rust toolchain + armv7 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-gnueabihf

      - name: armv7 cross toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            gcc-arm-linux-gnueabihf libc6-dev-armhf-cross
          arm-linux-gnueabihf-gcc -v 2>&1 | tail -2

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web dashboard
        run: cargo web build

      - name: Build zeroclaw (channel-qq + embedded-web)
        env:
          CC_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-gcc
          AR_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-ar
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
        run: |
          cargo build --release --locked \
            --target armv7-unknown-linux-gnueabihf \
            --features "channel-qq,embedded-web"

      - name: Package
        run: |
          mkdir -p out
          cp target/armv7-unknown-linux-gnueabihf/release/zeroclaw out/zeroclaw
          sha256sum out/zeroclaw > out/SHA256SUMS
          ls -la out/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zeroclaw-armv7-qq-bubbles-${{ inputs.version }}
          path: out/
          retention-days: 14
