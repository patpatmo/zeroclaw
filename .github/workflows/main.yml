name: Build ZeroClaw ARMv7 (Static Musl + Embedded Web)

on:
  push:
    branches: [ main ] # 如果你的默认分支是 master，请改为 master
  workflow_dispatch: # 允许手动触发

jobs:
  build-armv7-musl:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. 构建 Web 仪表板资源
      - name: Build Web Dashboard
        run: cargo web build

      # 2. 安装 Rust 和 musl 目标
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-musleabihf

      # 3. 安装 cross
      - name: Install cross
        run: cargo install cross --version 0.2.5 --locked

      # 4. 静态 musl 编译，并启用 embedded-web
      - name: Build static ARMv7 musl binary
        run: |
          cross build --release \
            --target armv7-unknown-linux-musleabihf \
            --features embedded-web

      # 5. 验证并准备直接上传的文件 (不再手动压缩)
      - name: Verify Binary
        run: |
          BIN_DIR="target/armv7-unknown-linux-musleabihf/release"
          BIN_NAME="zeroclaw"
          
          echo "===== 校验二进制文件 ====="
          if [ ! -f "$BIN_DIR/$BIN_NAME" ]; then
            echo "❌ 编译产物不存在或不是普通文件"
            exit 1
          fi
          file "$BIN_DIR/$BIN_NAME"
          
          # 检查是否真的是静态链接
          if file "$BIN_DIR/$BIN_NAME" | grep -q "statically linked"; then
            echo "✅ 确认是静态链接二进制"
          else
            echo "⚠️  警告：产物可能不是静态链接，请检查"
          fi

          # 创建一个干净的输出目录，把文件复制进去并重命名
          mkdir -p output
          cp "$BIN_DIR/$BIN_NAME" output/zeroclaw-armv7-static
          
          ls -lh output/

      # 6. 直接上传裸文件，让 GitHub 帮你打成一个干净的 zip
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zeroclaw-armv7-static
          path: output/zeroclaw-armv7-static
          if-no-files-found: error
